<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Contact Form Flexbox</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f5f5;
            padding: 30px;
        }

        .contact-container {
            max-width: 900px;
            margin: auto;
            border: 2px solid #333;
            padding: 30px;
            background: #e9e9e9;
        }

        .contact-container h2 {
            margin-bottom: 25px;
            color: #555;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .row {
            display: flex;
            gap: 20px;
        }

        .row input {
            flex: 1;
        }

        input, textarea {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            width: 100%;
            font-size: 14px;
        }

        textarea {
            resize: none;
            height: 200px;
        }
        
        .bottom-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        button {
            background: #6bb6d6;
            border: none;
            padding: 12px 20px;
            color: white;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background: #4fa3c7;
        }

        .note {
            font-size: 14px;
            color: #666;
        }
    </style>
</head>
<body>

<div class="contact-container">
    <h2>Get in touch with us by filling contact form below</h2>

    <form>
        <div class="row">
            <input type="text" placeholder="* Enter your full name">
            <input type="email" placeholder="* Enter your email address">
        </div>

        <input type="text" placeholder="Enter your subject">

        <textarea placeholder="* Your message here..."></textarea>

        <div class="bottom-row">
            <button type="submit">Send message</button>
            <div class="note">* Please fill all required form field, thanks!</div>
        </div>
    </form>
</div>

</body>
</html>
