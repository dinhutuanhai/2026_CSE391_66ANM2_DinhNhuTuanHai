<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Quản lý điểm sinh viên</title>

<style>

body{
font-family:Arial;
margin:40px;
}

input,select,button{
padding:6px;
margin-right:10px;
}

table{
border-collapse:collapse;
margin-top:20px;
width:700px;
}

th,td{
border:1px solid #ccc;
padding:8px;
text-align:center;
}

th{
background:#f2f2f2;
cursor:pointer;
}

.yeu{
background:yellow;
}

.no-result{
color:red;
text-align:center;
}

.stats{
margin-top:15px;
font-weight:bold;
}

</style>
</head>

<body>

<h2>Quản lý điểm sinh viên</h2>

<!-- thêm sinh viên -->
<input id="name" type="text" placeholder="Họ tên">
<input id="score" type="number" placeholder="Điểm (0-10)">
<button id="addBtn">Thêm</button>

<br><br>

<!-- tìm kiếm -->
<input id="search" type="text" placeholder="Tìm kiếm tên">

<!-- lọc -->
<select id="filterRank">
<option value="all">Tất cả</option>
<option value="Giỏi">Giỏi</option>
<option value="Khá">Khá</option>
<option value="Trung bình">Trung bình</option>
<option value="Yếu">Yếu</option>
</select>

<table>

<thead>
<tr>
<th>STT</th>
<th>Họ tên</th>
<th id="sortScore">Điểm ▲▼</th>
<th>Xếp loại</th>
<th>Thao tác</th>
</tr>
</thead>

<tbody id="tableBody"></tbody>

</table>

<div class="stats">
Tổng sinh viên: <span id="total">0</span> |
Điểm trung bình: <span id="avg">0</span>
</div>

<script src="script.js"></script>

</body>
</html>
