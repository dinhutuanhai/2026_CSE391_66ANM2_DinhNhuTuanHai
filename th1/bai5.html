<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>HR Management</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        /* ===== NAVBAR ===== */
        .navbar {
            background: #1f262c;
            color: #fff;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar a {
            color: #ccc;
            margin-left: 15px;
            text-decoration: none;
        }

        .navbar input {
            padding: 5px;
        }

        /* ===== CONTAINER ===== */
        .container {
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .add-btn {
            background: #0d6efd;
            color: #fff;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
        }

        /* ===== TABLE ===== */
        table {
            width: 100%;
            background: #fff;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #f0f0f0;
        }

        .btn {
            padding: 5px 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            color: #fff;
        }

        .btn-edit {
            background: #ffc107;
            color: #000;
        }

        .btn-delete {
            background: #dc3545;
        }

        /* ===== MODAL ===== */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.4);
        }

        .modal-content {
            background: #fff;
            width: 500px;
            margin: 100px auto;
            border-radius: 5px;
            overflow: hidden;
        }

        .modal-header {
            background: #0d6efd;
            color: #fff;
            padding: 10px;
            display: flex;
            justify-content: space-between;
        }

        .modal-body {
            padding: 15px;
        }

        .form-group {
            margin-bottom: 10px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 6px;
        }

        .modal-footer {
            text-align: right;
            padding: 10px;
        }

        .btn-save {
            background: #198754;
        }

        .btn-cancel {
            background: #6c757d;
        }
    </style>
</head>
<body>

<!-- NAVBAR -->
<div class="navbar">
    <div>
        <strong>HR Management</strong>
        <a href="#">Home</a>
        <a href="#">Contact</a>
    </div>
    <div>
        <input type="text" placeholder="Search...">
        <button class="btn btn-edit">Search</button>
    </div>
</div>

<!-- CONTENT -->
<div class="container">
    <div class="header">
        <h2>Employee</h2>
        <button class="add-btn" onclick="openModal()">+ Add</button>
    </div>

    <table>
        <tr>
            <th>ID</th><th>Name</th><th>Email</th><th>Phone</th><th>Position</th><th>Action</th>
        </tr>
        <tr>
            <td>1</td><td>Fatima Beatriz</td><td>Fatima@gmail.com</td><td>0985674321</td><td>Staff</td>
            <td>
                <button class="btn btn-edit">Edit</button>
                <button class="btn btn-delete">Delete</button>
            </td>
        </tr>
        <tr>
            <td>2</td><td>Gabriel Hanna</td><td>Gabriel@gmail.com</td><td>0353674231</td><td>Staff</td>
            <td>
                <button class="btn btn-edit">Edit</button>
                <button class="btn btn-delete">Delete</button>
            </td>
        </tr>
    </table>
</div>

<!-- MODAL -->
<div class="modal" id="modal">
    <div class="modal-content">
        <div class="modal-header">
            <span>New Employee</span>
            <span style="cursor:pointer" onclick="closeModal()">✖</span>
        </div>

        <div class="modal-body">
            <div class="form-group">
                <label>Name</label>
                <input type="text">
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email">
            </div>

            <div class="form-group">
                <label>Phone</label>
                <input type="text">
            </div>

            <div class="form-group">
                <label>Position</label>
                <select>
                    <option>-- Select Position --</option>
                    <option>Staff</option>
                    <option>Manager</option>
                    <option>CEO</option>
                </select>
            </div>

            <div class="form-group">
                <label>Sex</label>
                <input type="radio" name="sex"> Male
                <input type="radio" name="sex"> Female
            </div>
        </div>

        <div class="modal-footer">
            <button class="btn btn-save">Save</button>
            <button class="btn btn-cancel" onclick="closeModal()">Cancel</button>
        </div>
    </div>
</div>

<script>
    function openModal() {
        document.getElementById("modal").style.display = "block";
    }

    function closeModal() {
        document.getElementById("modal").style.display = "none";
    }
</script>

</body>
</html>
