<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Employee Form</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #e9e9e9;
        padding: 20px;
    }

    .form-wrapper {
        width: 900px;
        margin: auto;
        background: #fff;
        padding: 30px;
        border-radius: 6px;
        box-shadow: 0 0 5px #ccc;
    }

    h3 {
        margin-top: 25px;
        margin-bottom: 10px;
        font-size: 18px;
        border-bottom: 1px solid #ccc;
        padding-bottom: 5px;
    }

    .row {
        display: flex;
        align-items: center;
        margin-bottom: 10px;
    }

    .row label {
        width: 180px;
        font-weight: bold;
        font-size: 14px;
    }

    .row input,
    .row select,
    .row textarea {
        width: 300px;
        padding: 6px;
    }

    input[type="radio"],
    input[type="checkbox"] {
        width: auto;
        margin-right: 5px;
    }

    textarea {
        height: 120px;
    }

    .notes-editor {
        width: 600px;
        border: 1px solid #ccc;
        padding: 5px;
        background: #fafafa;
    }

    .captcha-box {
        font-size: 22px;
        font-weight: bold;
        letter-spacing: 5px;
        margin-bottom: 5px;
    }

    .submit-area {
        margin-top: 20px;
        text-align: right;
    }

    button {
        padding: 7px 15px;
        margin-left: 5px;
    }
</style>
</head>

<body>

<div class="form-wrapper">

    <h3>Basic Info</h3>

    <div class="row"><label>Employee ID</label> <input type="text" value="9"></div>
    <div class="row"><label>Last Name</label> <input type="text" value="Dodsworth"></div>
    <div class="row"><label>First Name</label> <input type="text" value="Anne"></div>

    <div class="row">
        <label>Gender</label>
        <div>
            <label><input type="radio" name="g"> Male</label><br>
            <label><input type="radio" name="g" checked> Female</label><br>
            <label><input type="radio" name="g"> XXX</label><br>
            <label><input type="radio" name="g"> ZZZ</label>
        </div>
    </div>

    <div class="row"><label>Title</label> <input type="text" value="Sales Representative"></div>
    <div class="row"><label>Suffix</label> <input type="text" value="Ms."></div>
    <div class="row"><label>Birth Date</label> <input type="datetime-local"></div>
    <div class="row"><label>Hire Date</label> <input type="datetime-local"></div>

    <div class="row"><label>Reports To</label>
        <select>
            <option>Buchanan</option>
            <option>King</option>
            <option>Fuller</option>
        </select>
    </div>

    <h3>Contact Info</h3>

    <div class="row"><label>Email</label> <input type="email" placeholder="name@example.com"></div>
    <div class="row"><label>Address</label> <input type="text" value="7 Houndstooth Rd."></div>
    <div class="row"><label>City</label> <input type="text" value="London"></div>
    <div class="row"><label>Region</label> <input type="text"></div>
    <div class="row"><label>Postal Code</label> <input type="text" value="WG2 7LT"></div>

    <div class="row"><label>Country</label>
        <select>
            <option>Russian Federation</option>
            <option>USA</option>
            <option>Vietnam</option>
        </select>
    </div>

    <div class="row"><label>US Home Phone</label> <input type="text" value="(234)234-2342"></div>
    <div class="row"><label>Photo</label> <input type="text" value="EmpID9.bmp"></div>

    <h3>Optional Info</h3>

    <div class="row"><label>Notes</label>
        <textarea>
Anne has a BA degree in English from St. Lawrence College.
She is fluent in French and German.
        </textarea>
    </div>

    <div class="row">
        <label>Preferred Shift</label>
        <div>
            <label><input type="radio" name="shift"> Regular</label><br>
            <label><input type="radio" name="shift"> Gravy Yard</label>
        </div>
    </div>

    <div class="row"><label>Active?</label> <input type="checkbox" checked></div>

    <div class="row">
        <label>Are you Human?</label>
        <div>
            <div class="captcha-box">TIDAWO</div>
            <button>Click to change</button>
        </div>
    </div>

    <div class="submit-area">
        <button>Submit</button>
        <button>Cancel</button>
    </div>

</div>

</body>
</html>
